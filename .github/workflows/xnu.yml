name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"
      - "tools/enable_xnu_ccache.py"
      - "tools/mkadt.py"
      - "tools/verify-dali-ramoops-adt.py"
      - "tools/mkpayload.py"
      - "tools/test_mkpayload_cmdline.py"
      - "tools/test_dali_hfs_diagnostics.py"
      - "tools/dali-root-capture.py"
      - "tools/test_dali_root_capture.py"
      - "tools/test_dali_boottrace.py"
      - "tools/test_dali_gui.py"
      - "tools/test_dali_hid_geometry.py"
      - "tools/test_dali_featuretrace.py"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}
  CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPILERCHECK: content
  SWEET_KDK_DMG: ${{ github.workspace }}/.ci-cache/kdk/KDK.dmg

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          python3 tools/enable_xnu_ccache.py dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja ccache
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Cache toolchain identity
        id: toolchain
        run: |
          identity=$({ xcodebuild -version; xcrun clang --version; xcrun --sdk macosx --show-sdk-version; ccache --version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "key=$identity" >> "$GITHUB_OUTPUT"
          echo "SWEET_CCACHE=$(command -v ccache)" >> "$GITHUB_ENV"

      - name: Restore KDK download
        uses: actions/cache@v4
        with:
          path: .ci-cache/kdk
          key: kdk-dmg-v1-${{ runner.os }}-${{ env.MACOS_VERSION }}-${{ env.DXB_SHA }}

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ci-cache/ccache
          key: xnu-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MACOS_VERSION }}-${{ env.KERNEL_CONFIG }}-${{ env.MACHINE_CONFIG }}-${{ steps.toolchain.outputs.key }}-${{ env.DXB_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            xnu-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MACOS_VERSION }}-${{ env.KERNEL_CONFIG }}-${{ env.MACHINE_CONFIG }}-${{ steps.toolchain.outputs.key }}-${{ env.DXB_SHA }}-

      - name: Initialize compiler cache statistics
        run: |
          ccache --show-config
          ccache --zero-stats

      - name: Test payload and Dali bring-up policies
        run: |
          python3 tools/test_mkpayload_cmdline.py
          python3 tools/test_dali_hfs_diagnostics.py
          python3 tools/test_dali_root_capture.py
          python3 tools/test_dali_boottrace.py
          python3 tools/test_dali_gui.py
          python3 tools/test_dali_hid_geometry.py
          python3 tools/test_dali_featuretrace.py

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Compiler cache statistics
        if: always()
        run: |
          if command -v ccache >/dev/null; then
            echo '### Compiler cache' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify SWEET init diagnostics
        working-directory: dxb
        run: |
          grep -Fq '#if DEVELOPMENT && defined(ARM64_BOARD_CONFIG_SWEET)' xnu/bsd/kern/bsd_init.c
          grep -Fq '#define DEBUG_BSDINIT 1' xnu/bsd/kern/bsd_init.c
          grep -Fq 'STARTUP_DEBUG_CALLBACKS = 0x00000002' xnu/osfmk/kern/startup.h
          grep -Fq 'const startup_debug_t callback_mask = STARTUP_DEBUG_CALLBACKS;' xnu/osfmk/kern/startup.c
          grep -Fq 'kernel_startup: phase %u begin' xnu/osfmk/kern/startup.c
          grep -Fq 'SWEET IOKit: matching returned' xnu/pexpert/arm/pe_init.c
          grep -Fq 'PE_lockdown_iokit returned; vm_set_restrictions begin' xnu/osfmk/kern/startup.c
          grep -Fq 'entry; throttle_init begin' xnu/bsd/kern/bsd_init.c
          grep -Fq "'dali-boot-cpu' = <01000000>" xnu/iokit/KernelConfigTables.cpp
          grep -Fq 'DALI CPU: boot-only match validated' xnu/iokit/Kernel/arm/SweetCPU.cpp
          grep -Fq 'DALI CPU: CPU completion published' xnu/iokit/Kernel/arm/SweetCPU.cpp
          grep -Fq 'DALI RTC: IORTC published from hardware' xnu/iokit/Kernel/arm/DaliRTC.cpp
          grep -Fq 'dali_pmif_transfer(9, address' xnu/iokit/Kernel/arm/DaliRTC.cpp
          grep -Fq 'IOLockLock(lock);' xnu/iokit/Kernel/arm/DaliPMIF.cpp
          grep -Fq 'sid != 9 && sid != 14' xnu/iokit/Kernel/arm/DaliPMIF.cpp
          grep -Fq 'bounded read-only mode' xnu/iokit/Kernel/arm/DaliUSBPMIC.cpp
          grep -Fq 'if (enabled != 1)' xnu/iokit/Kernel/arm/DaliUSBPMIC.cpp
          grep -Fq 'if (cp == 1)' xnu/iokit/Kernel/arm/DaliUSBPMIC.cpp
          grep -Fq 'probeChargePump = i2cRange[0] == 0x120a0000' xnu/iokit/Kernel/arm/DaliUSBPMIC.cpp
          grep -Fq 'id != 0x85' xnu/iokit/Kernel/arm/DaliI2C5.cpp
          grep -Fq 'repeatedID != id' xnu/iokit/Kernel/arm/DaliI2C5.cpp
          grep -Fq 'PE_parse_boot_argn("daliotg"' xnu/iokit/Kernel/arm/DaliUSBPMIC.cpp
          grep -Fq 'config[0] == 5000000 && config[1] == 500000 && config[2] == 0x8585' xnu/iokit/Kernel/arm/DaliUSBPMIC.cpp
          grep -Fq 'control == 0 && mode == 0 && present == 8' xnu/iokit/Kernel/arm/DaliI2C5.cpp
          grep -Fq 'version != 0xa0' xnu/iokit/Kernel/arm/DaliI2C5.cpp
          grep -Fq 'state == Powered && !rootSession && now - stateStartedMs >= 60000' xnu/iokit/Kernel/arm/DaliUSBPower.cpp
          grep -Fq 'dali_usb_host_root_active()' xnu/iokit/Kernel/arm/DaliUSBPower.cpp
          grep -Fq 'keeping VBUS for rescan=' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI OTG: host scan idle; retaining 5V source VBUS='
          grep -Fq 'roleTouched = true;' xnu/iokit/Kernel/arm/DaliUSBPower.cpp
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI OTG: VBUS valid'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'cleanup incomplete; reboot required'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI OTG: snapshot %s'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI OTG: read16 failed reg=0470'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI OTG: ending tick='
          grep -Fq 'fault == 0x80 && !(raw & ~0x3ffU)' xnu/iokit/Kernel/arm/DaliUSBPower.cpp
          grep -Fq 'state != Initial || ticks != 1 || initialFaultAckAttempted' xnu/iokit/Kernel/arm/DaliUSBPower.cpp
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI OTG: initial fault80 W1C'
          grep -Fq 'update(0x490, 0x0b, 3)' xnu/iokit/Kernel/arm/DaliUSBPower.cpp
          grep -Fq 'update(0x490, 0x0b, savedSys2)' xnu/iokit/Kernel/arm/DaliUSBPower.cpp
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI OTG: TCPC detection wake'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI OTG: TCPC wake cleanup='
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI OTG: write failed reg='
          grep -Fq 'readADC(11, &pd)' xnu/iokit/Kernel/arm/DaliUSBPower.cpp
          grep -Fq 'update(0x155, 0x1f, savedReport)' xnu/iokit/Kernel/arm/DaliUSBPower.cpp
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI ADC: PDVBUS='
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI ADC: failed channel='
          grep -Fq '(hostSW || change(0x300, 2U, 0))' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          ! grep -Fq 'change(0x300, 1U << 1, 0);' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI OTG: attach accepted tick='
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI OTG: pre-host tick='
          grep -Fq 'attachedRole = c2 == 2 ? 0x06 : 0x09;' xnu/iokit/Kernel/arm/DaliUSBPower.cpp
          grep -Fq 'write8(0x41a, attachedRole)' xnu/iokit/Kernel/arm/DaliUSBPower.cpp
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'attached-source CC role programmed'
          grep -Fq 'rearmCount < 3' xnu/iokit/Kernel/arm/DaliUSBPower.cpp
          grep -Fq 'return finishLocked("detached", true);' xnu/iokit/Kernel/arm/DaliUSBPower.cpp
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI OTG FINAL:'
          grep -Fq 'startupStage = "get-device-descriptor-prefix";' xnu/iokit/Kernel/arm/DaliXHCI.cpp
          grep -Fq 'startupStage = "msc-read-capacity";' xnu/iokit/Kernel/arm/DaliXHCI.cpp
          grep -Fq 'startupStage = "hfs-read-mbr";' xnu/iokit/Kernel/arm/DaliXHCI.cpp
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI USB SCAN FINAL:'
          grep -Fq 'stats->firstRead = true;' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq 'channel != 2 && channel != 5 && channel != 7' xnu/iokit/Kernel/arm/DaliUSBPower.cpp
          grep -Fq 'readDiagnosticADC(2, &dp)' xnu/iokit/Kernel/arm/DaliUSBPower.cpp
          grep -Fq 'readDiagnosticADC(5, &ibus)' xnu/iokit/Kernel/arm/DaliUSBPower.cpp
          grep -Fq 'readDiagnosticADC(7, &dm)' xnu/iokit/Kernel/arm/DaliUSBPower.cpp
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI ADC PROBE: pre-host tick='
          grep -Fq 'dali_usb_host_observe(hostHwrscsV2, hostVusbAlwaysOn, hostNativePhyValidated);' xnu/iokit/Kernel/arm/DaliUSBPower.cpp
          grep -Fq 'PE_parse_boot_argn("daliusbhost"' xnu/iokit/Kernel/arm/DaliUSBPMIC.cpp
          grep -Fq 'hostRanges[6] != 0x16790000 || hostRanges[7] != 0x100' xnu/iokit/Kernel/arm/DaliUSBPMIC.cpp
          grep -Fq 'domainReady(dp, false) && domainReady(p0, true)' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq 'phy.read(0x300), phy.read(0x318), phy.read(0x368), phy.read(0x36c)' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq 'kHwrscsForceMask = 0x7f00U' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq 'kHwrscsPmicMask = 0x80U' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq 'kRequestGateOffsets[8]' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq 'releaseResourcesAndRestore(ip, requestGates,' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq 'if (clockReady && analogReady) {' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI HOST: PHY reads skipped U2 MAC reset status'
          grep -Fq 'host-hwrscs-version' xnu/iokit/Kernel/arm/DaliUSBPMIC.cpp
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI HOST: SPM force='
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI HOST: SPM state unsupported req='
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI HOST: REQ_GATE unlock/readback failed restore='
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI HOST: SPM v2 request ACK timeout'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI HOST: powered clocks='
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI HOST: host handoff cleaned sleep='
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI HOST: SPM off req='
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI HOST: reset restore want='
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI HOST: restore SPM req='
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI HOST: restore gates='
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI HOST: restore ACK req='
          grep -Fq 'PE_parse_boot_argn("daliusbport"' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq '(saved & ~3U) | 0x204U' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq 'bool u3Touched = engineProbe;' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq 'uint32_t wantedU3 = (u3 & ~3U) | 4U;' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq 'constexpr uint32_t kMtu3U3ClockMask = 0x10501U;' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq 'u3Ready = u3Control && waitBits(ip, 0x10, kMtu3U3ClockMask,' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq 'wanted = (wanted & ~kMtu3U2RoleMask) | kMtu3U2ForceIddigHost;' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq 'class ScopedMtu3HostMac' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq '{0x0c84, 0x00000003U, 0U, 0, false, true}' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq '{0x2450, 0x00000fffU, 0x474U, 0, false, false}' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq '{0x1680, 0x3fffU << 16, 1U << 16, 0, false, false}' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq 'bool hostMacRestored = hostMac.restore();' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI MTU3: host init tuning ready fields=%u hs=%08x/%08x usb3=%08x'
          grep -Fq 'ip.write(0x30, wantedU3);' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq 'ip.write(0x30, u3);' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI U3: host enable saved='
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI U3: restore want='
          grep -Fq 'class ScopedDaliUsb3Phy' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq 'const uint8_t expectedRole = (polarity & 1U) ? 0x06 : 0x09;' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          ! grep -Fq 'role != 0x05' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq 'roleAgain != expectedRole' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          ! grep -Fq 'roleAgain != 0x05' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI U3 PHY: attached-source orientation mismatch'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI U3 PHY: orientation recheck failed before selector polarity='
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI U3 PHY: native host lane ready=1 orientation='
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI U3 PHY: owned lane/selector restored='
          grep -Fq 'portRestored && asleep && releaseResourcesAndRestore' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI U2: MAC ready='
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI U2: enable saved='
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI U2: PORTSC sample='
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI U2: restore want='
          grep -Fq 'if (hostObserve && hostJoined) { dali_usb_host_report(); }' xnu/iokit/Kernel/arm/DaliUSBPower.cpp
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI U2 REPORT: saved results begin'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI U2 REPORT: end; saved text only, no hardware access'
          grep -Fq 'PE_parse_boot_argn("daliusbpp"' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI PP: halted PORTSC writes disabled'
          grep -Fq 'host-dma-policy' xnu/iokit/Kernel/arm/DaliUSBPMIC.cpp
          grep -Fq 'host-u2-calibration' xnu/iokit/Kernel/arm/DaliUSBPMIC.cpp
          grep -Fq 'dali_usb_host_stop()' xnu/iokit/Kernel/arm/DaliUSBPower.cpp
          grep -Fq 'if (!portRestored)' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          grep -Fq 'first->control ^= 1U;' xnu/iokit/Kernel/arm/DaliXHCI.cpp
          grep -Fq 'if (physical + offset == completedShortTRB)' xnu/iokit/Kernel/arm/DaliXHCI.cpp
          grep -Fq '((control >> 16) & 31) == completedShortEndpoint' xnu/iokit/Kernel/arm/DaliXHCI.cpp
          grep -Fq 'arenaMap = memory->map(kIOMapAnywhere | kIOMapInhibitCache)' xnu/iokit/Kernel/arm/DaliXHCI.cpp
          grep -Fq 'if (!(buf_flags(bp) & B_READ)) { error = EROFS;' xnu/bsd/dev/dali_usb_disk.c
          grep -Fq 'usbroot != 1 && PE_parse_boot_argn("rootrw"' xnu/bsd/vfs/vfs_subr.c
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI XHCI: running AC64=1'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI XHCI: start failed stage='
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI XHCI: No-op enqueue'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI XHCI: port power ready'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI XHCI: port power readback failed'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI XHCI: attachment snapshot'
          grep -Fq 'startupStage = "port-power-readback";' xnu/iokit/Kernel/arm/DaliXHCI.cpp
          grep -Fq 'if (!wait(reg, 0x200, 0x200, 100))' xnu/iokit/Kernel/arm/DaliXHCI.cpp
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI XHCI: event poll rejected'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI XHCI: event timeout'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI XHCI: command event rejected'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI XHCI: event regs'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI XHCI: DMA pa='
          grep -Fq 'char text[8192];' xnu/iokit/Kernel/arm/DaliUSBHost.cpp
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI XHCI: init cap='
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI XHCI: arena validation failed'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI XHCI: health rejected clocks'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI XHCI: health rejected PMIF'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'DALI XHCI: health rejected supply'
          grep -Fq 'startupStage = "pre-reset-health";' xnu/iokit/Kernel/arm/DaliXHCI.cpp
