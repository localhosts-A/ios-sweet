          grep -Fq 'SWEET HFS: BlockMarkFree failed first=%u count=%u error=%d' xnu/bsd/sweet_hfs/core/VolumeAllocation.c
          grep -Fq 'SWEET BOOT SESSION UUID: %s' xnu/iokit/Kernel/IOPMrootDomain.cpp
          grep -Fq 'SWEET UFS: Dali root writes explicitly enabled for partition' xnu/bsd/dev/sweet_ufs.c
          grep -Fq 'SWEET UFS: refusing Dali root partition' xnu/bsd/dev/sweet_ufs.c
          grep -Fq 'SWEET UFS: Dali unixnu_data view blocks=' xnu/bsd/dev/sweet_ufs.c
          grep -Fq 'SWEET UFS: Dali root write prefix cap=' xnu/bsd/dev/sweet_ufs.c
          grep -Fq 'SWEET LOG: payload sync failed' xnu/bsd/dev/sweet_ufs.c
          grep -Fq 'SWEET LOG: Dali root-tail fallback disabled' xnu/bsd/dev/sweet_ufs.c
          grep -Fq 'PE_parse_boot_argn("rootrw", &rootrw' xnu/bsd/vfs/vfs_subr.c
          grep -Fq 'if (!su.writable || !su.nblocks' xnu/bsd/dev/sweet_ufs.c
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: Dali root writes explicitly enabled for partition "%s"'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET HFS: extent-release fileid=%u fork=%u start=%u count=%u target=1966891'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET HFS: truncate-tail-release fileid=%u fork=%u first=%u count=%u target=1966891'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET HFS: truncate-following-release fileid=%u fork=%u first=%u count=%u target=1966891'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET HFS: bitmap-free mismatch first=%u count=%u word=0x%x validate=%u'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET HFS: BlockDeallocate failed first=%u count=%u flags=0x%x error=%d'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET HFS: BlockMarkFree failed first=%u count=%u error=%d'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET BOOT SESSION UUID: %s'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: refusing Dali root partition "%s"; only unixnu_data is allowed'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: Dali unixnu_data view blocks=%llu GPT blocks=%llu hidden tail=%llu'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: Dali root write prefix cap=%llu blocks'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET LOG: payload sync failed (%d), stopping'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET LOG: Dali root-tail fallback disabled; use unixnu_logs'
          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("xnu/bsd/dev/sweet_ufs.c").read_text()

          def function_body(name):
              match = re.search(r"static (?:int|void)\s+" + re.escape(name) + r"\([^;]*?\)\s*\{", source, re.S)
              assert match, f"missing function {name}"
              start = match.end() - 1
              depth = 0
              for end in range(start, len(source)):
                  if source[end] == "{":
                      depth += 1
                  elif source[end] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[start:end + 1]
              raise AssertionError(f"unterminated function {name}")

          init = function_body("ufs_dali_initialize_device")
          assert init.index("ufs_query_fdeviceinit_flag(0x06, NULL)") < init.index("ufs_query_fdeviceinit_flag(0x05, &flag)")
          assert "UFS_DEVICE_INIT_MAX_POLLS" in init and "mach_absolute_time() >= deadline" in init
          prepare = function_body("ufs_dali_prepare_lun")
          assert prepare.index("ufs_dali_initialize_device()") < prepare.index("ufs_query_current_power_mode(&power_mode)")
          ufs_init = function_body("sweet_ufs_init")
          assert "su.writable = (rw != 0);" in source
          assert "Dali root writes explicitly enabled for partition" in source
          assert "ignoring ufsrw on Dali" not in source
          root_guard = 'if (su.dali && strcmp(want, "unixnu_data") != 0)'
          assert root_guard in ufs_init
          assert ufs_init.index(root_guard) < ufs_init.index('su.failure_stage = "hci-range"')
          assert 'if (su.dali && su.writable && strcmp(want, "unixnu_data") != 0)' in ufs_init
          assert 'strcmp(log_want, "unixnu_logs") != 0' in ufs_init
          writes = function_body("ufs_write_blocks")
          assert "!su.writable" in writes
          assert "lba < su.first_block" in writes
          assert "count > su.nblocks - (lba - su.first_block)" in writes
          log_writes = function_body("ufs_write_log_blocks")
          assert "su.log_first_block" in log_writes and "su.log_nblocks" in log_writes
          assert "su.dali || !su.writable" in function_body("sweet_log_start")
          log_thread = function_body("sweet_log_thread")
          payload_sync = log_thread.index("error = ufs_sync_cache();")
          header_write = log_thread.index("ufs_write_log_blocks(base, 1)")
          header_sync = log_thread.rindex("error = ufs_sync_cache();")
          assert payload_sync < header_write < header_sync
          payload_sync_error_path = log_thread[payload_sync:header_write]
          assert "if (error)" in payload_sync_error_path
          assert "lck_mtx_unlock(&sweet_ufs_lock);" in payload_sync_error_path
          assert "return;" in payload_sync_error_path, "payload sync failure must not publish a log header"
          assert re.search(
              r'if \(SecureDTGetProperty\(node, "compatible", \(void const \*\*\)&compatible,\s*&compatible_size\) == kSuccess &&\s*compatible != NULL &&\s*compatible_size >= sizeof\("mediatek,mt6991-ufshc"\) &&\s*memcmp\(compatible, "mediatek,mt6991-ufshc", sizeof\("mediatek,mt6991-ufshc"\)\) == 0\) \{\s*su\.dali = true;\s*\}',
              ufs_init,
          ), "Dali flag must be sourced from the MT6991 UFS compatible"
          assert re.search(
              r'if \(su\.dali\) \{\s*printf\("SWEET USB: skipped Qualcomm DWC3 probe on Dali MT6991\\n"\);\s*\} else \{\s*sweet_usb_probe\(\);\s*\}',
              source,
          ), "Dali must skip the Qualcomm-only USB probe before root selection returns"
          gpt_match = re.search(r"static int\s+ufs_find_partitions\([^;]*?\)\s*\{", source, re.S)
          assert gpt_match, "missing ufs_find_partitions"
          gpt_start = gpt_match.end() - 1
          depth = 0
          for gpt_end in range(gpt_start, len(source)):
              if source[gpt_end] == "{":
                  depth += 1
              elif source[gpt_end] == "}":
                  depth -= 1
                  if depth == 0:
                      break
          else:
              raise AssertionError("unterminated ufs_find_partitions")
          gpt = source[gpt_start:gpt_end + 1]
          assert "DALI_ROOT_MAX_BYTES (16ull * 1024ull * 1024ull * 1024ull)" in source
          assert "DALI_ROOT_MAX_BLOCKS (DALI_ROOT_MAX_BYTES / UFS_BLOCK)" in source
          assert 'strcmp(root_want, "unixnu_data") == 0' in gpt
          assert "MIN(su.nblocks, DALI_ROOT_MAX_BLOCKS)" in gpt
          reads = [m.start() for m in re.finditer(r"ufs_read_blocks\(1, 1\)", gpt)]
          assert len(reads) == 2, f"expected initial GPT header read and one retry, found {len(reads)}"
          assert reads[0] < gpt.index("ufs_dali_start_lun_and_wait()") < reads[1]
          PY
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'uic-link-startup'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'MT6991 host startup failed stage='
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: AO reset stage=%s offset=0x%x mask=0x%x old=0x%x write=0x%x readback=0x%x'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: READ(10) failed lba=0x%llx count=%u bytes=%u error=%d'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: sense segment=%u length=%u residual=0x%x key=0x%x asc=0x%x ascq=0x%x raw_bytes=%u raw=%s'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: bCurrentPowerMode=0x%x'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: sending START STOP UNIT ACTIVE to device WLUN 0xd0'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: root LUN %u ready after %u TEST UNIT READY polls'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: root LUN %u remained not ready after %u polls'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: QUERY READ ATTRIBUTE malformed response ocs=0x%x type=0x%x lun=0x%x tag=0x%x response=0x%x opcode=0x%x idn=0x%x length=0x%x'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: sending START UNIT to root LUN %u after NOT READY 04/02'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: START UNIT failed for root LUN %u error=%d sense=%u/%u/%u'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: root LUN %u ready after START UNIT and %u TUR polls'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: root LUN %u did not become ready after START UNIT error=%d sense=%u/%u/%u'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: root LUN %u remained not ready after START UNIT and %u TUR polls'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: fDeviceInit SET_FLAG issued after LINK_STARTUP'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: fDeviceInit cleared after %u READ_FLAG polls'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: fDeviceInit did not clear before timeout after %u READ_FLAG polls'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET USB: skipped Qualcomm DWC3 probe on Dali MT6991'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: QUERY fDeviceInit malformed response opcode=0x%x ocs=0x%x type=0x%x lun=0x%x tag=0x%x response=0x%x function=0x%x idn=0x%x length=0x%x'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: GPT header read needs LUN start; retrying once after SCSI START UNIT'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: GPT header READ(10) succeeded after START UNIT'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS: GPT header READ(10) retry after START UNIT failed (%d)'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET DALI RAMOOPS: root diagnostics begin'
          strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep -F 'SWEET UFS root %s unavailable: %d stage=%s'
          python3 ../tools/verify-dali-ramoops-adt.py

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
